<div class="auth-page">
  <div class="pycods-card auth-card text-center">
    <app-mascot [size]="120" [mood]="step === 3 ? 'cheer' : 'think'"></app-mascot>

    <ng-container *ngIf="step === 1">
      <h2 class="text-3xl font-bold text-indigo-700 mt-2 mb-1">¿Olvidaste tu contraseña?</h2>
      <p class="text-600 font-medium mb-4">No pasa nada. Escribe tu correo y te damos un código.</p>
      <div class="flex flex-column gap-3 text-left">
        <label for="email" class="font-semibold text-700">Correo electrónico</label>
        <input id="email" pInputText type="email" [(ngModel)]="email" placeholder="tucorreo@ejemplo.com" class="w-full" (keyup.enter)="sendCode()">
        <p-message *ngIf="error" severity="error" [text]="error" styleClass="w-full"></p-message>
        <button pButton label="Enviarme el código ✉️" class="p-button-indigo w-full" [disabled]="!email.includes('@') || loading" [loading]="loading" (click)="sendCode()"></button>
      </div>
    </ng-container>

    <ng-container *ngIf="step === 2">
      <h2 class="text-3xl font-bold text-indigo-700 mt-2 mb-1">Escribe tu código</h2>
      <p class="text-600 font-medium mb-3">{{ info }}</p>
      <div class="dev-box" *ngIf="devCode" role="status">
        Modo local (sin servidor de correo): tu código es <b>{{ devCode }}</b>
      </div>
      <div class="flex flex-column gap-3 text-left">
        <label for="code" class="font-semibold text-700">Código de 6 dígitos</label>
        <input id="code" pInputText inputmode="numeric" maxlength="6" [(ngModel)]="code" placeholder="123456" class="w-full code-input">
        <label for="pw" class="font-semibold text-700">Nueva contraseña</label>
        <p-password inputId="pw" [(ngModel)]="password" [toggleMask]="true" [feedback]="false" placeholder="Mínimo 6 caracteres" styleClass="w-full" inputStyleClass="w-full"></p-password>
        <p-message *ngIf="error" severity="error" [text]="error" styleClass="w-full"></p-message>
        <button pButton label="Cambiar contraseña 🔑" class="p-button-indigo w-full" [disabled]="code.length < 6 || password.length < 6 || loading" [loading]="loading" (click)="changePassword()"></button>
      </div>
    </ng-container>

    <ng-container *ngIf="step === 3">
      <h2 class="text-3xl font-bold text-green-700 mt-2 mb-1">¡Listo! 🎉</h2>
      <p class="text-600 font-medium mb-4">Tu contraseña se cambió. Ya puedes entrar.</p>
      <a pButton routerLink="/login" label="Ir a iniciar sesión 🚀" class="p-button-indigo w-full no-underline"></a>
    </ng-container>

    <div class="mt-3" *ngIf="step !== 3"><a routerLink="/login" class="text-indigo-600 font-semibold no-underline hover:underline">Volver a iniciar sesión</a></div>
  </div>
</div>
